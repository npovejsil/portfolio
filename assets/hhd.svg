<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hhdMain" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e4ecf2"></stop>
      <stop offset="0.45" stop-color="#cfd8e0"></stop>
      <stop offset="0.55" stop-color="#b9c5cf"></stop>
      <stop offset="1" stop-color="#8a97a3"></stop>
    </linearGradient>
    <linearGradient id="hhdFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef3"></stop>
      <stop offset="1" stop-color="#a7b4be"></stop>
    </linearGradient>
    <linearGradient id="hhdBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b8893"></stop>
      <stop offset="1" stop-color="#5a6670"></stop>
    </linearGradient>
    <linearGradient id="hhdSlot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d21"></stop>
      <stop offset="1" stop-color="#3a4048"></stop>
    </linearGradient>
    <linearGradient id="hhdHilite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="hhdShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"></feGaussianBlur>
      <feOffset dx="0" dy="3"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <ellipse cx="100" cy="175" rx="72" ry="6" fill="#000" opacity="0.35"></ellipse>

  
  <g filter="url(#hhdShadow)">
    <rect x="22" y="44" width="156" height="116" rx="10" ry="10" fill="url(#hhdMain)"></rect>
    
    <rect x="22" y="44" width="156" height="20" rx="10" ry="10" fill="url(#hhdHilite)" opacity="0.55"></rect>
    
    <rect x="22" y="44" width="2" height="116" fill="#ffffff" opacity="0.35"></rect>
    
    <rect x="176" y="44" width="2" height="116" fill="#000" opacity="0.18"></rect>
  </g>

  
  <rect x="30" y="68" width="140" height="72" rx="3" ry="3" fill="url(#hhdFront)" opacity="0.55"></rect>

  
  <g>
    <rect x="72" y="52" width="56" height="12" rx="2" fill="url(#hhdSlot)"></rect>
    <polygon points="118,55 123,55 120.5,60" fill="#9fb2c2"></polygon>
    <rect x="76" y="57" width="32" height="2" rx="1" fill="#5a6874"></rect>
  </g>

  
  <g fill="#55636e" opacity="0.85">
    <rect x="148" y="88" width="18" height="1.4"></rect>
    <rect x="148" y="92" width="18" height="1.4"></rect>
    <rect x="148" y="96" width="18" height="1.4"></rect>
    <rect x="148" y="100" width="18" height="1.4"></rect>
    <rect x="148" y="104" width="18" height="1.4"></rect>
    <rect x="148" y="108" width="18" height="1.4"></rect>
    <rect x="148" y="112" width="18" height="1.4"></rect>
    <rect x="148" y="116" width="18" height="1.4"></rect>
    <rect x="148" y="120" width="18" height="1.4"></rect>
    <rect x="148" y="124" width="18" height="1.4"></rect>
  </g>

  
  <g transform="translate(80,104)">
    <circle r="26" fill="#eff3f7" stroke="#8a97a3" stroke-width="0.8"></circle>
    <circle r="22" fill="none" stroke="#b9c5cf" stroke-width="0.6"></circle>
    <circle r="17" fill="none" stroke="#b9c5cf" stroke-width="0.6"></circle>
    <circle r="12" fill="none" stroke="#b9c5cf" stroke-width="0.6"></circle>
    <circle r="4" fill="#8a97a3"></circle>
    <circle r="1.6" fill="#3a4048"></circle>
    
    <path d="M -28 -22 L 6 -4 L 10 0 L 8 4 L -24 -18 Z" fill="#cfd8e0" stroke="#8a97a3" stroke-width="0.6"></path>
    <circle cx="-28" cy="-22" r="3" fill="#8a97a3"></circle>
  </g>

  
  <rect x="22" y="156" width="156" height="4" rx="2" fill="url(#hhdBottom)"></rect>
</svg>